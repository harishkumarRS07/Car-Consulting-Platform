services:
  - type: web
    runtime: static
    name: car-consulting-frontend
    rootDir: .
    buildCommand: cd frontend && npm install && npm run build && cd .. && cp -r frontend/dist ./dist
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
